[package]
name = "aether-gateway"
version = "0.1.0"
edition = "2026"
description = "Aether Gateway — L4 proxy for accepting Aether connections and proxying to TCP/HTTP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikaafo/aether-protocol"

[dependencies]
aether-core = { path = "../aether-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"