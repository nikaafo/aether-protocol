[package]
name = "aether-demo"
version = "0.1.0"
edition = "2021"
description = "Aether Protocol — демо-приложение (echo server + client)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "aether-demo"
path = "src/main.rs"

[dependencies]
aether-core = { path = "../aether-core" }
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"